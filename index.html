<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazabilidad · Recylink</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --g25:#FCFCFD;--g50:#F9FAFB;--g100:#F2F4F7;--g200:#E4E7EC;--g300:#D0D5DD;
  --g400:#98A2B3;--g500:#667085;--g600:#475467;--g700:#344054;--g800:#1D2939;--g900:#101828;
  --p200:#B3DFF5;--p500:#0083C0;--p600:#0069A6;--p700:#00528B;
  --err:#F04438;--warn:#F79009;--ok:#039855;--na:#667085;
  --err-l:#FEE4E2;--warn-l:#FEF0C7;--ok-l:#D1FADF;--na-l:#F2F4F7;
  --bd:var(--g200);--tx:var(--g900);--tx2:var(--g600);--brand:var(--p600);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--g100);color:var(--tx);font-size:14px;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid var(--bd);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:12px;}
.logo img{height:28px;width:auto;display:block;}
.logo-sep{color:var(--g300);margin:0 2px;}
.logo-sub{font-size:12px;color:var(--tx2);font-weight:600;}
.top-right{display:flex;align-items:center;gap:10px;}
.month-sel{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--bd);border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;color:var(--g700);background:#fff;}
.month-sel select{border:none;outline:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--g700);background:transparent;cursor:pointer;}
.layout{display:flex;min-height:calc(100vh - 58px);}
.sidebar{width:232px;background:#fff;border-right:1px solid var(--bd);flex-shrink:0;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;}
.sb-section{padding:16px 16px 6px;font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.7px;}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;}
.sb-item:hover{background:var(--g50);}
.sb-item.active{background:#EBF5FC;border-left-color:var(--brand);}
.sb-item.active .sb-name{color:var(--brand);font-weight:700;}
.sb-group{margin-bottom:2px;}
.sb-group-hdr{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 14px;cursor:pointer;background:var(--g50);border-left:3px solid transparent;transition:all .12s;user-select:none;}
.sb-group-hdr:hover{background:var(--g100);}
.sb-group-hdr.open{border-left-color:var(--brand);}
.sb-group-logo{width:28px;height:28px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--g200);padding:2px;flex-shrink:0;}
.sb-group-av{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.sb-group-name{font-size:12px;font-weight:700;color:var(--g800);flex:1;}
.sb-group-count{font-size:10px;color:var(--tx2);background:var(--g200);padding:1px 6px;border-radius:999px;}
.sb-chevron{font-size:10px;color:var(--g400);transition:transform .18s;flex-shrink:0;}
.sb-chevron.open{transform:rotate(90deg);}
.sb-children{overflow:hidden;transition:max-height .2s ease;}
.sb-suc{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 28px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;}
.sb-suc:hover{background:var(--g25);}
.sb-suc.active{background:#EBF5FC;border-left-color:var(--brand);}
.sb-suc.active .sb-suc-name{color:var(--brand);font-weight:700;}
.sb-suc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sb-suc-info{flex:1;min-width:0;}
.sb-suc-name{font-size:11px;font-weight:600;color:var(--g600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-suc-pct{font-size:10px;font-weight:700;flex-shrink:0;}
.sb-info{flex:1;min-width:0;}
.sb-name{font-size:12px;font-weight:600;color:var(--g700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-sub{font-size:10px;color:var(--tx2);}
.sb-pct{font-size:11px;font-weight:700;flex-shrink:0;}
.sb-divider{height:1px;background:var(--bd);margin:8px 16px;}
.main{flex:1;padding:24px 28px;min-width:0;overflow-x:hidden;}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.kpi-val{font-size:24px;font-weight:700;line-height:1;}
.kpi-desc{font-size:10px;color:var(--tx2);margin-top:3px;}
.kpi.highlight{border-color:var(--p500);background:#EBF5FC;}
.kpi.highlight .kpi-lbl{color:var(--brand);}
.emp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.emp-title{display:flex;align-items:center;gap:10px;}
.emp-av{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.emp-name{font-size:16px;font-weight:700;}
.vtabs{display:flex;border-bottom:1.5px solid var(--bd);margin-bottom:18px;}
.vtab{padding:8px 16px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;display:flex;align-items:center;gap:5px;transition:color .12s;}
.vtab:hover{color:var(--brand);}
.vtab.active{color:var(--brand);border-bottom-color:var(--brand);}
.vtab-badge{background:var(--g100);color:var(--g600);padding:1px 6px;border-radius:999px;font-size:10px;font-weight:700;}
.vtab.active .vtab-badge{background:var(--p200);color:var(--p700);}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.card-header{padding:12px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;}
.card-sub{font-size:11px;color:var(--tx2);}
.prog-wrap{display:flex;align-items:center;gap:8px;}
.prog-bg{height:8px;border-radius:999px;background:var(--g100);overflow:hidden;}
.prog-fill{height:100%;border-radius:999px;transition:width .4s;}
.prog-lbl{font-size:12px;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{padding:8px 12px;font-size:10px;font-weight:700;color:var(--tx2);text-align:left;border-bottom:1px solid var(--bd);background:var(--g50);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--g100);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--g25);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-ok{background:var(--ok-l);color:var(--ok);}
.b-falta{background:var(--err-l);color:var(--err);}
.b-na{background:var(--na-l);color:var(--na);}
.filters{display:flex;align-items:center;gap:6px;padding:9px 16px;border-bottom:1px solid var(--bd);background:var(--g50);flex-wrap:wrap;}
.fbtn{padding:4px 10px;border:1.5px solid var(--bd);border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:var(--tx2);font-family:inherit;transition:all .12s;}
.fbtn:hover,.fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.res-tag{background:var(--g100);color:var(--g700);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;}
.falta-banner{padding:9px 16px;background:var(--err-l);font-size:12px;color:var(--err);font-weight:600;border-top:1px solid var(--bd);}
.obs-banner{padding:9px 16px;background:var(--warn-l);font-size:12px;color:#92400E;border-top:1px solid var(--bd);}
.falta-summary{background:#fff;border:1px solid var(--err);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.falta-sum-header{padding:11px 18px;background:var(--err-l);display:flex;align-items:center;gap:8px;}
.falta-sum-title{font-size:12px;font-weight:700;color:var(--err);}
.falta-items{padding:12px 18px;display:flex;flex-direction:column;gap:7px;}
.falta-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:var(--g50);border-radius:8px;border:1px solid var(--g100);}
.falta-residuo{font-size:12px;font-weight:700;color:var(--g800);min-width:130px;flex-shrink:0;}
.falta-docs{font-size:11px;color:var(--err);line-height:1.5;}
/* PENDIENTE DESCRIPCION */
.pend-box{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.pend-header{padding:12px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.pend-title{font-size:13px;font-weight:700;}
.pend-body{padding:14px 18px;}
.pend-textarea{width:100%;min-height:80px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;font-family:inherit;font-size:12px;color:var(--tx);background:var(--g50);resize:vertical;outline:none;transition:border-color .15s;}
.pend-textarea:focus{border-color:var(--brand);background:#fff;}
.pend-saved{padding:10px 18px;background:var(--ok-l);font-size:12px;color:var(--ok);font-weight:600;display:none;}
.pend-btn{margin-top:8px;padding:7px 16px;background:var(--brand);color:#fff;border:none;border-radius:7px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.pend-btn:hover{background:var(--p500);}
/* CSE */
.cse-section{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.cse-header{padding:12px 18px;background:var(--g50);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.cse-title{font-size:13px;font-weight:700;color:var(--brand);}
.cse-pct-big{font-size:26px;font-weight:700;}
.cse-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.cse-item{padding:14px 16px;border-right:1px solid var(--bd);}
.cse-item:last-child{border-right:none;}
.cse-item-lbl{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
.cse-months{display:flex;gap:4px;flex-wrap:wrap;}
.cse-month{display:flex;flex-direction:column;align-items:center;gap:2px;}
.cse-month-name{font-size:9px;color:var(--tx2);font-weight:600;}
.cse-dot{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.dot-ok{background:var(--ok-l);color:var(--ok);}
.dot-no{background:var(--err-l);color:var(--err);}
.dot-na{background:var(--g100);color:var(--g400);}
.dot-fut{background:var(--g100);color:var(--g300);}
/* ANUAL */
.ann-wrap{overflow-x:auto;}
.ann-table{min-width:860px;border-collapse:collapse;width:100%;}
.ann-table th{padding:7px 8px;font-size:9px;font-weight:700;color:var(--tx2);text-align:center;border-bottom:1px solid var(--bd);background:var(--g50);text-transform:uppercase;letter-spacing:.3px;}
.ann-table th:first-child{text-align:left;min-width:170px;padding-left:14px;}
.ann-table td{padding:7px 8px;font-size:12px;border-bottom:1px solid var(--g100);text-align:center;}
.ann-table td:first-child{text-align:left;font-size:11px;font-weight:600;color:var(--g700);padding-left:14px;}
.ann-table tr:last-child td{border-bottom:none;}
.cell-ok{color:var(--ok);font-size:14px;font-weight:700;}
.cell-no{color:var(--err);font-size:14px;font-weight:700;}
.cell-na2{color:var(--g400);font-size:12px;}
.cell-fut{color:var(--g200);font-size:12px;}
.ann-sep td{font-size:10px!important;font-weight:700!important;color:var(--tx2)!important;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px!important;padding-left:14px!important;background:var(--g50)!important;border-bottom:1px solid var(--bd)!important;}
.residuos-cell{font-size:10px;color:var(--g700);text-align:left!important;line-height:1.6;max-width:160px;}
.ann-falta-cell{font-size:10px;color:var(--err);text-align:left!important;line-height:1.4;max-width:150px;}
.ann-obs-cell{font-size:10px;color:var(--g600);text-align:left!important;max-width:150px;}
/* OBJETIVOS */
.obj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 18px;}
.obj-item{padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--g50);}
.obj-text{font-size:12px;font-weight:600;color:var(--g700);margin-bottom:8px;}
.obj-prog{display:flex;align-items:center;gap:8px;}
.obj-num{font-size:13px;font-weight:700;}
/* VALORIZACIÓN */
.val-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap;}
.val-chip-ok{background:var(--ok-l);color:var(--ok);}
.val-chip-warn{background:var(--warn-l);color:#92400E;}
.val-chip-err{background:var(--err-l);color:var(--err);}
.val-chip-na{background:var(--na-l);color:var(--na);}
.vt-wrap{overflow-x:auto;}
.vt-table{min-width:900px;border-collapse:collapse;width:100%;}
.vt-table th{padding:8px 10px;font-size:9px;font-weight:700;color:var(--tx2);text-align:center;border-bottom:1px solid var(--bd);background:var(--g50);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.vt-table th.th-left{text-align:left;min-width:160px;padding-left:16px;}
.vt-table th.th-avance{min-width:150px;text-align:left;padding-left:10px;}
.vt-table th.th-mes{min-width:62px;}
.vt-table td{padding:0;border-bottom:1px solid var(--g100);vertical-align:middle;}
.vt-table tr:last-child td{border-bottom:none;}
.vt-table tr:hover td{background:var(--g25);}
.vt-emp-cell{padding:12px 10px 12px 16px;display:flex;flex-direction:column;gap:2px;}
.vt-emp-name{font-size:12px;font-weight:700;color:var(--g800);}
.vt-emp-suc{font-size:10px;color:var(--tx2);}
.vt-meta-cell{padding:10px;text-align:center;}
.vt-meta-pct{font-size:15px;font-weight:700;color:var(--g700);}
.vt-meta-lbl{font-size:9px;color:var(--g400);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.vt-avance-cell{padding:10px 14px 10px 10px;}
.vt-avance-wrap{display:flex;align-items:center;gap:8px;}
.vt-avance-track{flex:1;height:10px;background:var(--g100);border-radius:999px;overflow:hidden;position:relative;}
.vt-avance-fill{height:100%;border-radius:999px;transition:width .5s;}
.vt-avance-nums{font-size:11px;font-weight:700;white-space:nowrap;min-width:52px;text-align:right;}
.vt-mes-cell{padding:8px 6px;text-align:center;}
.vt-mes-pct{font-size:13px;font-weight:700;display:block;line-height:1;}
.vt-mes-bar{width:28px;height:4px;border-radius:999px;margin:4px auto 0;background:var(--g100);overflow:hidden;}
.vt-mes-bar-fill{height:100%;border-radius:999px;}
.vt-mes-na{color:var(--g300);font-size:11px;}
.vt-mes-fut{color:var(--g200);font-size:11px;}
.vt-mes-activo{background:#EBF5FC!important;}
.vt-sep td{background:var(--g50)!important;padding:5px 16px!important;font-size:9px!important;font-weight:700!important;color:var(--g400)!important;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd)!important;}
.val-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid var(--bd);background:var(--g50);}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2);}
.empty{padding:40px;text-align:center;color:var(--tx2);font-size:12px;}
.sidebar{width:232px;background:#fff;border-right:1px solid var(--bd);flex-shrink:0;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;}

/* ── MINUTAS (integrado al visor) ── */
.mn-sb-empty{padding:14px 16px;font-size:11.5px;color:var(--tx2);line-height:1.5;}
.mn-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mn-topbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--bd);border-radius:8px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--g700);background:#fff;cursor:pointer;transition:all .12s;}
.mn-topbtn:hover{border-color:var(--brand);color:var(--brand);}
.mn-topbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.mn-topbtn.primary:hover{background:var(--p500);color:#fff;}
.mn-topbtn:disabled{opacity:.45;cursor:not-allowed;}
.mn-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--tx2);}
.mn-status-dot{width:7px;height:7px;border-radius:50%;background:var(--g400);flex-shrink:0;}
.mn-status-dot.ok{background:var(--ok);}
.mn-status-dot.err{background:var(--err);}
.mn-cfg{padding:10px 14px;border-top:1px solid var(--bd);background:var(--g50);display:none;}
.mn-cfg.open{display:block;}
.mn-cfg label{display:block;font-size:10.5px;font-weight:700;color:var(--g700);margin-bottom:5px;}
.mn-cfg input[type=text]{width:100%;padding:7px 10px;border:1.5px solid var(--bd);border-radius:7px;font-family:inherit;font-size:11.5px;color:var(--tx);background:#fff;outline:none;margin-bottom:8px;}
.mn-cfg .hint{display:block;font-size:10px;color:var(--tx2);margin-bottom:8px;line-height:1.5;}
th.mn-mc{width:32px;text-align:center;}
th.mn-rc{width:32px;text-align:center;}
td.mn-mc{text-align:center;vertical-align:middle;}
.mn-item-input{width:100%;border:none;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--tx);padding:4px 2px;outline:none;border-bottom:1px dashed transparent;resize:vertical;min-height:20px;line-height:1.4;}
.mn-item-input:focus{border-bottom-color:var(--brand);}
.mn-cell-textarea{width:100%;min-height:38px;border:1px solid transparent;background:transparent;font-family:inherit;font-size:12px;color:var(--g700);padding:5px 6px;border-radius:6px;resize:vertical;outline:none;line-height:1.45;}
.mn-cell-textarea:hover{background:var(--g50);}
.mn-cell-textarea:focus{border-color:var(--brand);background:#fff;}
tr.mn-done td{background:var(--g50);}
tr.mn-done .mn-item-input{text-decoration:line-through;color:var(--g400);}
tr.mn-done .mn-cell-textarea{color:var(--g400);}
.mn-remove-btn{background:none;border:none;color:var(--g400);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;}
.mn-remove-btn:hover{color:var(--err);background:var(--err-l);}
.mn-empty-state{padding:36px 20px;text-align:center;color:var(--tx2);font-size:13px;}
.mn-toast{position:fixed;bottom:24px;right:24px;background:var(--g900);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(16,24,40,0.25);opacity:0;transform:translateY(8px);transition:all .25s ease;pointer-events:none;z-index:600;max-width:340px;}
.mn-toast.show{opacity:1;transform:translateY(0);}
.mn-toast.err{background:var(--err);}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
@media(max-width:1100px){.main [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important;}}


@media(max-width:1100px){.main [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important;}}


/* ── BOTÓN EXPORTAR ── */
.btn-export{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s;}
.btn-export:hover{background:var(--p500);}
.btn-export svg{flex-shrink:0;}

/* ── MODAL DE EXPORTACIÓN ── */
.export-overlay{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:500;align-items:center;justify-content:center;}
.export-overlay.open{display:flex;}
.export-modal{background:#fff;border-radius:14px;padding:28px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.18);}

/* ── ESTILOS DE IMPRESIÓN PDF ── */
@media print {
  @page { size: A4 landscape; margin: 10mm 10mm 10mm 10mm; }
  @page :first { margin-top: 10mm; }
  body { background: #fff !important; font-size: 8px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Ocultar UI de navegación */
  .topbar, .sidebar, .btn-export, .export-overlay, .vtabs,
  .filters, .pend-body, .month-sel, #empSelWrap,
  .sb-section, .sb-divider, .pend-box { display: none !important; }

  /* Layout */
  .layout { display: block !important; }
  .main   { padding: 0 !important; max-width: 100% !important; }

  /* Cabecera de impresión */
  .print-header { display: flex !important; }

  /* Cards */
  .card {
    box-shadow: none !important;
    border: 0.5px solid #D0D5DD !important;
    margin-bottom: 8px !important;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* KPIs — fila horizontal compacta */
  .kpi-row {
    display: grid !important;
    grid-template-columns: repeat(5,1fr) !important;
    gap: 5px !important;
    margin-bottom: 8px !important;
  }
  .kpi { padding: 7px 9px !important; }
  .kpi-val { font-size: 18px !important; }
  .kpi-lbl { font-size: 8px !important; }
  .kpi-desc { font-size: 8px !important; }

  /* Tabla mensual principal — cabe en landscape A4 */
  .card table,
  .ann-table,
  .vt-table {
    width: 100% !important;
    min-width: unset !important;
    font-size: 7.5px !important;
    table-layout: fixed;
  }
  th {
    font-size: 7px !important;
    padding: 4px 4px !important;
    white-space: normal !important;
    word-break: break-word;
  }
  td {
    font-size: 7.5px !important;
    padding: 4px 4px !important;
    vertical-align: middle !important;
  }

  /* Badges más pequeños en impresión */
  .badge {
    font-size: 7px !important;
    padding: 1px 4px !important;
    white-space: nowrap;
  }
  .res-tag { font-size: 7.5px !important; padding: 1px 4px !important; }

  /* Quitar scroll horizontal — todo visible */
  div[style*="overflow-x:auto"],
  div[style*="overflow-x: auto"],
  .ann-wrap, .vt-wrap { overflow: visible !important; }

  /* Anchos de columna fijos para la tabla de trazabilidad */
  .col-residuo  { width: 13% !important; }
  .col-imp      { width: 6%  !important; }
  .col-doc      { width: 9%  !important; } /* 8 columnas × 9% = 72% + 13% + 6% = 91% */

  /* Progreso bars */
  .prog-bg, .prog-fill, .vt-avance-fill,
  .vt-mes-bar-fill, .av-fill, .bar-fill { print-color-adjust: exact !important; }

  /* Ocultar elementos secundarios en impresión */
  .legend { display: none !important; }
  .emp-header { margin-bottom: 6px !important; }
  .emp-name { font-size: 11px !important; }

  /* CSE dots */
  .cse-dot { width: 16px !important; height: 16px !important; font-size: 9px !important; }
  .cse-row { display: grid; grid-template-columns: repeat(3,1fr); }

  /* Saltos de página */
  .card + .card { page-break-before: auto; }
}
.print-header { display: none; align-items: center; justify-content: space-between;
  padding: 0 0 14px; border-bottom: 2px solid #0069A6; margin-bottom: 14px; }
.print-header img { height: 24px; }
.print-header-info { text-align: right; font-size: 10px; color: #667085; }

// ============================================================

const DATA_SOURCE_URL = "https://script.google.com/macros/s/AKfycbx5mKQ873Ob_3Yd4n1kUI5imxEpXO5UzllhMpYGCoIBFHwBKSI9Moct7p9SYuEL9znM/exec";
// Cada cuántos minutos se refresca el dato en segundo plano (sin recargar la página)
const REFRESH_MINUTOS = 5;

// ============================================================
// CONSTANTES

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let MESES_ACTIVOS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio"];
// (ya no se usa un "mes futuro fijo": esFuturo() se calcula directo desde MESES_ACTIVOS)
const DOCS_RES = ["Cert. tratamiento","Factura","Cert. declaración","Transportista","Disposición final"];
// ── Grupos de docs para la vista mensual dividida ─────────
const DOCS_TRAZO_COLS = ["Transportista","Disposición final"]; // + Importaciones = trazabilidad
const DOCS_DOC_COLS   = ["Cert. tratamiento","Factura","Cert. declaración"]; // documentos
const DOCS_TRAZO = ["Importado","Cert. tratamiento","Cert. declaración"];

// ============================================================

// Lookup rápido nombre → código
const COD = {};
CATALOGO_RESIDUOS.forEach(r=>COD[r.nombre]=r.codigo);

// ============================================================
// METAS EDITABLES — separadas de EMPRESAS para edición en vivo
// ============================================================
const METAS_STORE = {};
function getMeta(empId){ return METAS_STORE[empId] ?? VAL_DATA[empId]?.meta ?? null; }
function setMeta(empId, val){ METAS_STORE[empId] = val; renderSidebar(); renderMain(); }

// ============================================================
// RESIDUOS ACTIVOS POR MES — qué residuos aplican cada mes/empresa
// El usuario puede activar/desactivar desde el filtro del visor
// Estructura: RESIDUOS_ACTIVOS[empId][mes] = Set de nombres de residuo
// Si no existe → muestra todos los que tienen imp>0 en los datos
// ============================================================
const RESIDUOS_ACTIVOS = {};

// ── Estado de grupos colapsados en sidebar ──────────────────
const GRUPOS_ABIERTOS = {};

// ── Paleta de colores por empresa ──────────────────────────
// getColor usa la constante de empresa configurada arriba
function getColor(empresa){
  return { color: EMPRESA_COLOR, colorBg: EMPRESA_COLOR_L };
}

// ============================================================
// SUCURSALES — una fila por sucursal de la empresa
// Para agregar sucursales: copiar un bloque y cambiar id/sucursal/datos
// ============================================================
const EMPRESAS = [];


// Almacén de descripciones de pendientes (editable por usuario)
const PENDIENTES_STORE = {};

// ============================================================
// DATOS DE VALORIZACIÓN
// % global mensual + meta POR MES (puede cambiar mes a mes o mantenerse igual)
// meta: { Enero:15, Febrero:15, ... } — si todos iguales se puede usar setMetaMes()
// ============================================================
const VAL_DATA = {};

// Store para metas editadas en vivo (empId → {mes → valor})
const METAS_VAL_STORE = {};
function getMetaMes(empId, mes){
  return METAS_VAL_STORE[empId]?.[mes] ?? VAL_DATA[empId]?.meta?.[mes] ?? null;
}
function setMetaMes(empId, mes, val){
  if(!METAS_VAL_STORE[empId]) METAS_VAL_STORE[empId]={};
  METAS_VAL_STORE[empId][mes] = val;
  renderMain();
}

// ============================================================
// STATE
// ============================================================
let mesActual = null;   // ← se define automáticamente al cargar los datos
let empActual = null;   // ← se define automáticamente al cargar los datos
let vistaActual = "mensual";
let vistaGlobal = "empresa"; // "empresa" | "minutas"
let filtroActual = "todos";

// ============================================================
// HELPERS
// ============================================================
const colorPct = p => p>=80?"#039855":p>=50?"#F79009":"#F04438";

function esFuturo(mes){
  const ultimoActivo = MESES_ACTIVOS[MESES_ACTIVOS.length - 1];
  if(!ultimoActivo) return true; // aún no hay datos de ningún mes
  return MESES.indexOf(mes) > MESES.indexOf(ultimoActivo);
}

// Nuevo formato: imp = número (total importaciones), docs[key] = número cargadas o null
// Formato viejo (compat): docs["Importado"]=true, docs[key]=true/false
function esNuevoFormato(r){ return typeof r.imp === "number"; }

// Residuos que aplican ese mes — nuevo: imp>0; viejo: Importado===true
// Respeta RESIDUOS_ACTIVOS si está definido para ese emp/mes
function resImportados(emp, mes){
  const d = emp.mensual[mes];
  if(!d) return [];
  let all = d.residuos.filter(r => esNuevoFormato(r) ? r.imp>0 : r.docs["Importado"]===true);
  const activos = RESIDUOS_ACTIVOS[emp.id]?.[mes];
  if(activos && activos.size>0) all = all.filter(r=>activos.has(r.nombre));
  return all;
}

// Convierte valor de doc a fracción [ok, total] según formato
function docFrac(v, impTotal){
  if(v===null||v===undefined) return null; // no aplica
  if(typeof v === "number") return [v, impTotal]; // nuevo: n/total
  if(v===true)  return [1,1]; // viejo: completo
  if(v===false) return [0,1]; // viejo: falta
  return null;
}

// % general: todos los docs de residuos importados ese mes
function pctMensual(emp, mes){
  if(esFuturo(mes)) return null;
  const res = resImportados(emp, mes);
  if(res.length===0) return null;
  let ok=0, tot=0;
  res.forEach(r=>{
    const imp = esNuevoFormato(r) ? r.imp : 1;
    DOCS_RES.forEach(doc=>{
      const f = docFrac(r.docs[doc], imp);
      if(!f) return;
      tot+=f[1]; ok+=f[0];
    });
  });
  return tot===0?0:Math.round(ok/tot*100);
}

// % trazabilidad documental clave
// % visible (excluye Ingreso/Costo) — usado en tablas de vista mensual
const DOCS_VISTA = ["Cert. tratamiento","Factura","Cert. declaración","Transportista","Disposición final"];
function pctResiduoVista(r){
  const imp = esNuevoFormato(r) ? r.imp : 1;
  let ok=0, tot=0;
  DOCS_VISTA.forEach(doc=>{
    const f = docFrac(r.docs[doc], imp);
    if(!f) return;
    tot+=f[1]; ok+=f[0];
  });
  return tot===0?null:Math.round(ok/tot*100);
}

function pctTrazo(emp, mes){
  if(esFuturo(mes)) return null;
  const res = resImportados(emp, mes);
  if(res.length===0) return null;
  let ok=0, tot=0;
  res.forEach(r=>{
    const imp = esNuevoFormato(r) ? r.imp : 1;
    ["Cert. tratamiento","Cert. declaración"].forEach(doc=>{
      const f = docFrac(r.docs[doc], imp);
      if(!f) return;
      tot+=f[1]; ok+=f[0];
    });
    tot+=imp; ok+=imp; // importaciones: siempre completo
  });
  return tot===0?0:Math.round(ok/tot*100);
}

function pctAnual(emp){
  const meses = MESES_ACTIVOS.filter(m=>!esFuturo(m));
  let ok=0,tot=0;
  Object.keys(emp.anual).forEach(f=>{
    meses.forEach(m=>{
      const v = emp.anual[f][m];
      if(v===null||v===undefined) return;
      tot++; if(v===true) ok++;
    });
  });
  return tot===0?0:Math.round(ok/tot*100);
}

// % trazabilidad documental clave — acumulado anual (alcance del cliente)
function pctTrazoAnual(emp){
  let ok=0, tot=0;
  MESES_ACTIVOS.filter(m=>!esFuturo(m)).forEach(m=>{
    const res = resImportados(emp, m);
    res.forEach(r=>{
      const imp = esNuevoFormato(r) ? r.imp : 1;
      ["Cert. tratamiento","Cert. declaración"].forEach(doc=>{
        const f = docFrac(r.docs[doc], imp);
        if(!f) return;
        tot+=f[1]; ok+=f[0];
      });
      tot+=imp; ok+=imp;
    });
  });
  return tot===0?null:Math.round(ok/tot*100);
}

// % TRAZABILIDAD REAL — solo Importaciones + Transportista + Disposición final
// Esta es la métrica que define el cumplimiento del objetivo "100% Trazabilidad"
function pctTrazabilidadMes(emp, mes){
  if(esFuturo(mes)) return null;
  const res = resImportados(emp, mes);
  if(res.length===0) return null;
  let ok=0, tot=0;
  res.forEach(r=>{
    const imp = esNuevoFormato(r) ? r.imp : 1;
    // Importaciones: siempre completo si el residuo fue importado
    ok += imp; tot += imp;
    // Transportista
    const tr = docFrac(r.docs["Transportista"], imp);
    if(tr){ tot+=tr[1]; ok+=tr[0]; }
    // Disposición final
    const df = docFrac(r.docs["Disposición final"], imp);
    if(df){ tot+=df[1]; ok+=df[0]; }
  });
  return tot===0?null:Math.round(ok/tot*100);
}

// % TRAZABILIDAD hasta un mes específico (inclusive)
function pctTrazabilidadHastaMes(emp, hastaM){
  const idx = MESES.indexOf(hastaM);
  const meses = MESES.slice(0, idx+1).filter(m=>!esFuturo(m));
  let ok=0, tot=0;
  meses.forEach(m=>{
    const res = resImportados(emp, m);
    res.forEach(r=>{
      const imp = esNuevoFormato(r) ? r.imp : 1;
      ok += imp; tot += imp;
      const tr = docFrac(r.docs["Transportista"], imp);
      if(tr){ tot+=tr[1]; ok+=tr[0]; }
      const df = docFrac(r.docs["Disposición final"], imp);
      if(df){ tot+=df[1]; ok+=df[0]; }
    });
  });
  return tot===0?null:Math.round(ok/tot*100);
}

// % TRAZABILIDAD ANUAL acumulado
function pctTrazabilidadAnual(emp, hastaMes){
  hastaMes = hastaMes || mesActual;
  const idxHasta = MESES.indexOf(hastaMes);
  const meses = MESES_ACTIVOS.filter(m=>MESES.indexOf(m) <= idxHasta);
  let ok=0, tot=0;
  meses.forEach(m=>{
    const res = resImportados(emp, m);
    res.forEach(r=>{
      const imp = esNuevoFormato(r) ? r.imp : 1;
      ok += imp; tot += imp;
      const tr = docFrac(r.docs["Transportista"], imp);
      if(tr){ tot+=tr[1]; ok+=tr[0]; }
      const df = docFrac(r.docs["Disposición final"], imp);
      if(df){ tot+=df[1]; ok+=df[0]; }
    });
  });
  return tot===0?null:Math.round(ok/tot*100);
}

// % DOCUMENTOS — solo cert. tratamiento + factura + declaración SINADER
function pctDocumentosMes(emp, mes){
  if(esFuturo(mes)) return null;
  const res = resImportados(emp, mes);
  if(res.length===0) return null;
  let ok=0, tot=0;
  res.forEach(r=>{
    const imp = esNuevoFormato(r) ? r.imp : 1;
    ["Cert. tratamiento","Factura","Cert. declaración"].forEach(doc=>{
      const f = docFrac(r.docs[doc], imp);
      if(!f) return;
      tot+=f[1]; ok+=f[0];
    });
  });
  return tot===0?null:Math.round(ok/tot*100);
}

// % de carga de un residuo específico ese mes (todos sus docs)
function pctResiduo(r){
  const imp = esNuevoFormato(r) ? r.imp : 1;
  let ok=0, tot=0;
  DOCS_RES.forEach(doc=>{
    const f = docFrac(r.docs[doc], imp);
    if(!f) return;
    tot+=f[1]; ok+=f[0];
  });
  return tot===0?null:Math.round(ok/tot*100);
}

function pctCSE(emp){
  const keys=["correo","reunion","encuesta"];
  let ok=0,tot=0;
  MESES_ACTIVOS.filter(m=>!esFuturo(m)).forEach(m=>{
    keys.forEach(k=>{
      const v=emp.cse[k][m];
      if(v===null||v===undefined) return;
      tot++; if(v===true) ok++;
    });
  });
  return tot===0?0:Math.round(ok/tot*100);
}

// bdg: renderiza badge de documento
// v = valor del doc (number, true, false, null)
// imp = total de importaciones del residuo
function bdg(v, imp){
  if(v===null||v===undefined) return `<span class="badge b-na">— No aplica</span>`;
  // Nuevo formato numérico
  if(typeof v === "number"){
    if(imp===undefined||imp===null) imp=1;
    if(v===0) return `<span class="badge b-falta">✗ Falta</span>`;
    if(v>=imp) return `<span class="badge b-ok">✓ Completo</span>`;
    return `<span class="badge" style="background:#FEF0C7;color:#92400E;font-weight:700;">${v}/${imp}</span>`;
  }
  // Formato viejo booleano
  if(v===true)  return `<span class="badge b-ok">✓ Cargado</span>`;
  if(v===false) return `<span class="badge b-falta">✗ Falta</span>`;
  return `<span class="badge b-na">—</span>`;
}

function cellA(v, mes){
  if(esFuturo(mes)) return `<span class="cell-fut">·</span>`;
  if(v===true)  return `<span class="cell-ok">✓</span>`;
  if(v===false) return `<span class="cell-no">✗</span>`;
  return `<span class="cell-na2">—</span>`; // null = no aplica
}

function dotCSE(v, mes){
  if(esFuturo(mes)) return `<div class="cse-dot dot-fut">·</div>`;
  if(v===true)  return `<div class="cse-dot dot-ok">✓</div>`;
  if(v===false) return `<div class="cse-dot dot-no">✗</div>`;
  return `<div class="cse-dot dot-na">—</div>`;
}

// PANEL FILTRO RESIDUOS — muestra todos los residuos del mes
// y permite activar/desactivar cuáles se muestran en la tabla
// ============================================================
function renderFiltroResiduos(emp, mes){
  const d = emp.mensual[mes];
  if(!d || d.residuos.length===0) return '';
  const todos = d.residuos.filter(r => esNuevoFormato(r) ? r.imp>0 : r.docs["Importado"]===true);
  if(todos.length===0) return '';
  const activos = RESIDUOS_ACTIVOS[emp.id]?.[mes];
  const isActivo = (nombre) => !activos || activos.size===0 || activos.has(nombre);
  return `
    <div style="padding:8px 16px;background:var(--g50);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span style="font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;">Residuos activos:</span>
      ${todos.map(r=>{
        const cod = r.codigo || COD[r.nombre] || "";
        const on = isActivo(r.nombre);
        return `<button onclick="toggleResiduo('${emp.id}','${mes}','${r.nombre.replace(/'/g,"\\'")}',${JSON.stringify(todos.map(x=>x.nombre))})"
          style="padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid ${on?'var(--brand)':'var(--g300)'};background:${on?'var(--brand)':'transparent'};color:${on?'#fff':'var(--g400)'};">
          ${r.nombre}${cod?` <span style="opacity:.7">${cod}</span>`:''}
        </button>`;
      }).join("")}
      ${activos&&activos.size>0?`<button onclick="resetResiduos('${emp.id}','${mes}')" style="padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;border:1.5px solid var(--g200);background:transparent;color:var(--g500);">Ver todos</button>`:''}
    </div>`;
}

function toggleResiduo(empId, mes, nombre, todos){
  if(!RESIDUOS_ACTIVOS[empId]) RESIDUOS_ACTIVOS[empId]={};
  if(!RESIDUOS_ACTIVOS[empId][mes]) RESIDUOS_ACTIVOS[empId][mes]=new Set(todos);
  const s = RESIDUOS_ACTIVOS[empId][mes];
  if(s.has(nombre)) s.delete(nombre);
  else s.add(nombre);
  if(s.size===todos.length) delete RESIDUOS_ACTIVOS[empId][mes]; // todos activos = sin filtro
  renderMain();
}

function resetResiduos(empId, mes){
  if(RESIDUOS_ACTIVOS[empId]) delete RESIDUOS_ACTIVOS[empId][mes];
  renderMain();
}

// ============================================================
// DONUT CHART — SVG simple de 2 colores
// ============================================================
function donutSVG(pct, color, size=38){
  if(pct===null) pct=0;
  const r=14, cx=19, cy=19;
  const circ = 2*Math.PI*r;
  const dash = (pct/100)*circ;
  const gap  = circ - dash;
  // track color: fondo gris claro
  return `<svg width="${size}" height="${size}" viewBox="0 0 38 38" style="transform:rotate(-90deg);flex-shrink:0;">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--g200)" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
      stroke-linecap="round"/>
  </svg>`;
}

function renderMensual(emp, filtro){
  const d = emp.mensual[mesActual];
  if(esFuturo(mesActual)) return `<div class="empty">Mes futuro — sin datos aún.</div>`;
  if(!d) return `<div class="empty">Sin datos para ${mesActual}. Actualiza la planilla.</div>`;

  let res = resImportados(emp, mesActual);

  if(res.length===0) return `
    <div class="card" style="border-color:var(--g300)">
      <div class="card-header"><div class="card-title">Detalle mensual — ${mesActual} 2026</div></div>
      <div class="empty" style="padding:32px">Sin residuos importados en ${mesActual}.</div>
      ${d.pendiente?`<div class="falta-banner">📝 ${d.pendiente}</div>`:''}
    </div>
    ${renderCSE(emp)}`;

  // Pendiente = trazabilidad incompleta (transp/disp final) O documentos incompletos
  // Completa = trazabilidad completa Y documentos completos
  function docIncompleto(r){
    const imp = esNuevoFormato(r) ? r.imp : 1;
    const docsARevisar = [...DOCS_TRAZO_COLS, ...DOCS_DOC_COLS];
    return docsARevisar.some(doc=>{
      const v = r.docs[doc];
      if(v===null||v===undefined) return false;
      if(typeof v === "number") return v < imp;
      return v===false;
    });
  }
  function docCompleto(r){ return !docIncompleto(r); }
  if(filtro==="falta") res = res.filter(r=>docIncompleto(r));
  if(filtro==="ok")    res = res.filter(r=>docCompleto(r));

  const pMes = pctTrazabilidadMes(emp, mesActual)??0; // % trazabilidad real
  const noRes = `<tr><td colspan="10" style="text-align:center;color:var(--g400);padding:24px">Sin resultados con ese filtro.</td></tr>`;

  // ── Filas compartidas para ambas tablas (mismo orden de residuos) ──
  // Helper % por tarjeta para cada residuo
  function pTrazoRes(r){
    const imp=esNuevoFormato(r)?r.imp:1; let ok=0,tot=0;
    ok+=imp; tot+=imp; // importaciones siempre completo si está importado
    ["Transportista","Disposición final"].forEach(d=>{
      const f=docFrac(r.docs[d],imp); if(!f)return; tot+=f[1]; ok+=f[0];
    });
    return tot===0?null:Math.round(ok/tot*100);
  }
  function pDocRes(r){
    const imp=esNuevoFormato(r)?r.imp:1; let ok=0,tot=0;
    ["Cert. tratamiento","Factura","Cert. declaración"].forEach(d=>{
      const f=docFrac(r.docs[d],imp); if(!f)return; tot+=f[1]; ok+=f[0];
    });
    return tot===0?null:Math.round(ok/tot*100);
  }
  function pCell(p){
    if(p===null) return `<td style="background:var(--g50);border-left:2px solid var(--g200);text-align:center;"><span style="color:var(--g300);font-size:11px;">—</span></td>`;

function renderCSE(emp, modo){

function renderAnual(emp){
  const meses = MESES;
  const _mesIdx = MESES.indexOf(mesActual);
  function esFuturoAnual(m){ return MESES.indexOf(m) > _mesIdx; }
  const pTrazo = pctTrazabilidadAnual(emp)??0;
  const pDocs  = (()=>{
    const ms=meses.filter(m=>!esFuturoAnual(m));
    let ok=0,tot=0;
    ms.forEach(m=>{
      resImportados(emp,m).forEach(r=>{
        const imp=esNuevoFormato(r)?r.imp:1;
        ["Cert. tratamiento","Factura","Cert. declaración"].forEach(d=>{
          const f=docFrac(r.docs[d],imp); if(!f)return; tot+=f[1]; ok+=f[0];
        });
      });
    });
    return tot===0?0:Math.round(ok/tot*100);
  })();

  // Helper: por mes y residuo, ✓ si transportista Y disposición final cargados
  function trazoMes(m){
    if(esFuturoAnual(m)) return `<td class="cell-fut">·</td>`;
    const res=resImportados(emp,m);
    if(!res.length) return `<td style="text-align:center"><span style="font-size:13px;font-weight:700;color:#F04438">0%</span></td>`;
    const p=pctTrazabilidadMes(emp,m);
    const col=colorPct(p??0);
    return `<td style="text-align:center">
      <span style="font-size:13px;font-weight:700;color:${col}">${p===null?"—":p+"%"}</span>
    </td>`;
  }
  function docsAnuoMes(docKey, m){
    if(esFuturoAnual(m)) return `<td class="cell-fut">·</td>`;
    const res = resImportados(emp, m);
    // Sin residuos importados en un mes que ya pasó/es el actual = falta cargar,
    // igual que la fila "Operaciones" (no es un "no aplica" neutro).
    if(!res.length) return `<td style="text-align:center"><span class="cell-no">✗</span></td>`;
    let ok=0,tot=0;
    res.forEach(r=>{
      const imp=esNuevoFormato(r)?r.imp:1;
      const f=docFrac(r.docs[docKey],imp); if(!f)return; tot+=f[1]; ok+=f[0];
    });
    if(tot===0) return `<td style="color:var(--g300);font-size:11px">—</td>`;
    // ✓ solo si todos completos, ✗ si falta alguno
    if(ok>=tot) return `<td style="text-align:center"><span class="cell-ok">✓</span></td>`;
    return `<td style="text-align:center"><span class="cell-no">✗</span></td>`;
  }

  const thMes = meses.map(m=>`<th style="${esFuturoAnual(m)?'color:var(--g300)':m===mesActual?'color:var(--brand);font-weight:800':''}">${m}</th>`).join("");

  return `

      <div class="card-header">
        <div>
          <div class="card-title" style="display:flex;align-items:center;gap:7px;">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block;"></span>
            Trazabilidad · Vista anual
          </div>
          <div class="card-sub">Operaciones · Transportista · Disposición final por mes</div>
        </div>
        <div class="prog-wrap">
          <div class="prog-bg" style="width:120px"><div class="prog-fill" style="width:${pTrazo}%;background:${colorPct(pTrazo)}"></div></div>
          <span class="prog-lbl" style="color:${colorPct(pTrazo)}">${pTrazo}%</span>
        </div>
      </div>
      <div class="ann-wrap">
        <table class="ann-table">
          <thead><tr>
            <th>Mes</th>${thMes}
          </tr></thead>
          <tbody>
            <tr class="ann-sep"><td colspan="${meses.length+1}">Residuos importados por mes</td></tr>
            <tr>
              <td style="font-size:11px;font-weight:600;color:var(--g700)">Operaciones</td>
              ${meses.map(m=>{
                if(esFuturoAnual(m)) return `<td class="cell-fut">·</td>`;
                const res=resImportados(emp,m);
                return res.length>0
                  ? `<td style="text-align:center"><span class="cell-ok">✓</span></td>`
                  : `<td style="text-align:center"><span class="cell-no">✗</span></td>`;
              }).join("")}

// % Trazabilidad de TODA la empresa (suma de todas las sucursales), hasta un mes dado
function pctTrazabilidadEmpresaTotal_(hastaMes){
  const idxHasta = MESES.indexOf(hastaMes);
  const meses = MESES_ACTIVOS.filter(m=>MESES.indexOf(m) <= idxHasta);
  let ok=0, tot=0;
  EMPRESAS.forEach(e=>{
    meses.forEach(m=>{
      resImportados(e, m).forEach(r=>{
        const imp = esNuevoFormato(r) ? r.imp : 1;
        ok += imp; tot += imp;
        const tr = docFrac(r.docs["Transportista"], imp);
        if(tr){ tot+=tr[1]; ok+=tr[0]; }
        const df = docFrac(r.docs["Disposición final"], imp);
        if(df){ tot+=df[1]; ok+=df[0]; }
      });
    });
  });
  return tot===0?null:Math.round(ok/tot*100);
}

// Calcula el estado real y visible de los objetivos de una obra:
// - Excluye del todo cualquier objetivo sintético de Valorización (las cards
//   "X% Valorización" / "Meta Valorización (sin definir)" que arma el Apps
//   Script aparte de los 7 de "Objetivos 2026").
// - Trazabilidad se recalcula en vivo con los datos reales.
// - "Registrar operaciones en forma unitaria" se da por cumplido salvo que
//   la planilla traiga explícitamente ok=false.
// - Usa comparación estricta de booleano para o.ok (no !==undefined), porque
//   la planilla puede traer null (sin dato) y eso NO es lo mismo que false.
function estadoObjetivosVisibles(emp, mesActualParam){
  const esValorizacionSintetica = t => /^meta valorizaci[oó]n\b/i.test(t) || /^\d+(\.\d+)?%\s*valorizaci[oó]n/i.test(t);

  return emp.objetivos
    .filter(o => !esValorizacionSintetica(o.texto))
    .map(o => {
      const esTrazabilidad = /trazabilidad/i.test(o.texto);
      const esOperacionUnitaria = /operaciones? en forma unitaria/i.test(o.texto);

      let avance, metaNum, detalle, ambito, ok;
      if (esTrazabilidad) {
        // Trazabilidad de ESTA obra puntual, Enero → mes seleccionado.
        // (pctTrazabilidadEmpresaTotal_ sumaría TODAS las sucursales de
        // Socovesa juntas, lo que diluye los problemas de una obra puntual —
        // por eso NO se usa acá.)
        avance = pctTrazabilidadHastaMes(emp, mesActualParam);
        metaNum = 100;
        detalle = "Importaciones + Transportista + Disposición final de esta obra";
        ambito = emp.sucursal || "esta obra";
        ok = avance !== null && avance >= metaNum;
      } else if (esOperacionUnitaria) {
        avance = (o.avance ?? o.pct ?? 100);
        metaNum = (o.meta ?? 100);
        detalle = o.detalle || "Las operaciones de esta obra se registran de forma unitaria";
        ambito = emp.sucursal || "esta obra";
        ok = (o.ok === false) ? false : true; // cumplido por defecto salvo dato explícito en contra
      } else {
        avance = (o.avance ?? o.pct ?? null);
        metaNum = (o.meta ?? 100);
        detalle = o.detalle || "";
        ambito = emp.sucursal || "esta obra";
        const sinDatoTmp = avance===null || avance===undefined || isNaN(avance);
        ok = sinDatoTmp ? false : (typeof o.ok === "boolean" ? o.ok : avance >= metaNum);
      }

      const sinDato = avance===null || avance===undefined || isNaN(avance);
      return { texto: o.texto, avance, metaNum, detalle, ambito, ok, sinDato };
    });
}

function renderObjetivos(emp){
  if(emp.objetivos.length===0) return `<div class="empty">Sin objetivos registrados para esta empresa.</div>`;

  // % real de trazabilidad anual calculado de los datos
  const pTrazoAnual = pctAnual(emp);
  // Rango evaluado: SIEMPRE Enero hasta el mes seleccionado en el visor
  const mesesConDatos = MESES_ACTIVOS.filter(m=>MESES.indexOf(m) <= MESES.indexOf(mesActual));

  const objetivosVisibles = estadoObjetivosVisibles(emp, mesActual);

  return `

      <div class="card-header">
        <div class="card-title">Objetivos 2026</div>

      </div>
      <div class="obj-grid">
        ${objetivosVisibles.map(o=>{
          const col = o.sinDato ? 'var(--g300)' : (o.ok ? '#039855' : (o.avance >= o.metaNum*0.7 ? '#F79009' : '#F04438'));
          const pctBarra = o.sinDato ? 0 : Math.min(Math.round(o.avance / o.metaNum * 100), 100);

          return `<div class="obj-item">
            <div class="obj-text">
              ${o.texto}
              <span style="font-size:10px;font-weight:500;color:var(--g400);margin-left:6px;">Ene–${mesActual.slice(0,3)} · ${o.ambito}</span>
            </div>
            <div class="obj-prog">
              <div class="prog-bg" style="flex:1">
                <div class="prog-fill" style="width:${pctBarra}%;background:${col}"></div>
              </div>
              <span class="prog-lbl" style="color:${col};min-width:42px;text-align:right">${o.sinDato?"—":o.avance+"%"}</span>
              ${o.sinDato?"":o.ok?`<span class="badge b-ok">✓</span>`:`<span class="badge b-falta">✗</span>`}
            </div>
            <div style="font-size:10px;color:var(--g400);margin-top:5px;">${o.sinDato?"Sin dato registrado aún para esta obra":o.detalle}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

// ============================================================
// VISTA VALORIZACIÓN — por sucursal, barras horizontales
// ============================================================
function renderValorizacion(emp){
  const vd    = VAL_DATA[emp.id];
  const meses = MESES.slice(0, MESES.indexOf(mesActual) + 1); // Enero → mes seleccionado, nada más

  function cV(p,mt){ if(p===null)return"var(--g300)"; if(mt===null)return colorPct(p); return p>=mt?"#039855":p>=(mt*.7)?"#F79009":"#F04438"; }
  function chip(p,mt){
    if(p===null)return'<span class="val-chip val-chip-na">Sin dato</span>';
    if(mt!==null){ if(p>=mt)return'<span class="val-chip val-chip-ok">\u2713 Sobre meta</span>'; if(p>=(mt*.7))return'<span class="val-chip val-chip-warn">\u2197 Cerca</span>'; return'<span class="val-chip val-chip-err">\u2198 Bajo meta</span>'; }
    return p>=80?'<span class="val-chip val-chip-ok">'+p+'%</span>':p>=40?'<span class="val-chip val-chip-warn">'+p+'%</span>':'<span class="val-chip val-chip-err">'+p+'%</span>';
  }
  const mi      = MESES.indexOf(mesActual);
  const pasados = meses.filter(m=>!esFuturo(m)&&vd?.meses[m]!=null);
  const vals    = pasados.map(m=>vd.meses[m]);
  const acumDisp = meses.filter(m=>vd?.acumulado?.[m]!=null && MESES.indexOf(m)<=mi);
  const ultimoMesAcumDetalle = acumDisp[acumDisp.length-1];
  const prom    = acumDisp.length ? vd.acumulado[ultimoMesAcumDetalle] : null; // SOLO dato real, sin fallback
  const pasadosHastaMes = meses.slice(0, mi+1).filter(m=>vd?.meses[m]!=null); // Enero, o Enero+Febrero, etc. según el mes elegido
  const promedioSimple = pasadosHastaMes.length?Math.round(pasadosHastaMes.map(m=>vd.meses[m]).reduce((a,b)=>a+b)/pasadosHastaMes.length*10)/10:null; // referencia aparte
  const mejor   = vals.length?Math.max(...vals):null;
  const mejorM  = mejor!==null?pasados[vals.indexOf(mejor)]:"";
  const tend    = vals.length>=2?Math.round((vals[vals.length-1]-vals[vals.length-2])*10)/10:null;
  const pAct    = esFuturo(mesActual)?null:(vd?.meses[mesActual]??null);
  const mAct    = getMetaMes(emp.id,mesActual);
  const metasV  = pasados.map(m=>getMetaMes(emp.id,m)).filter(v=>v!=null);
  const promM   = metasV.length?metasV.reduce((a,b)=>a+b)/metasV.length:null;

  // % Acumulado real (dato del Sheet) por mes; SOLO si ese mes ya tiene el dato cargado
  function acum(mi){
    const mNombre = meses[mi];
    return vd?.acumulado?.[mNombre]!=null ? vd.acumulado[mNombre] : null;
  }
  function bar(v,col){
    return '<div style="display:flex;align-items:center;gap:8px;">'
      +'<div style="width:110px;height:8px;background:var(--g100);border-radius:999px;overflow:hidden;flex-shrink:0;">'
      +'<div style="height:100%;width:'+v+'%;background:'+col+';border-radius:999px;"></div></div>'
      +'<span style="font-size:14px;font-weight:700;color:'+col+';min-width:40px;">'+v+'%</span></div>';
  }

  return `
    <div class="kpi-row" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px;">
      <div class="kpi">
        <div class="kpi-lbl">Valorizaci\u00f3n ${mesActual}</div>
        <div class="kpi-val" style="color:${cV(pAct,mAct)}">${pAct===null?"&#8212;":pAct+"%"}</div>
        <div class="kpi-desc">${mAct!=null?"Meta: "+mAct+"%":"Sin meta"}</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">Acumulado 2026</div>
        <div class="kpi-val" style="color:${cV(prom,promM)}">${prom===null?"&#8212;":prom+"%"}</div>
        <div class="kpi-desc">${prom===null?"Sin dato real a\u00fan":ultimoMesAcumDetalle==="Enero"?"Enero":`Enero a ${ultimoMesAcumDetalle} \u00b7 ${MESES.indexOf(ultimoMesAcumDetalle)+1} meses`}</div>
      </div>
      <div class="kpi" style="background:var(--g50);">
        <div class="kpi-lbl" style="color:var(--g400);">Promedio simple</div>
        <div class="kpi-val" style="color:var(--g500);font-size:20px;">${promedioSimple===null?"&#8212;":promedioSimple+"%"}</div>
        <div class="kpi-desc">${mesActual==="Enero"?"Enero":`Enero a ${mesActual} \u00b7 ${pasadosHastaMes.length} meses`}</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">Mejor mes</div>
        <div class="kpi-val" style="color:#039855">${mejor===null?"&#8212;":mejor+"%"}</div>
        <div class="kpi-desc">${mejorM||"&#8212;"}</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">Tendencia</div>
        <div class="kpi-val" style="color:${tend===null?"var(--g400)":tend>0?"#039855":tend<0?"#F04438":"var(--g400)"}">${tend===null?"&#8212;":tend>0?"\u2191 +"+tend+"%":tend<0?"\u2193 "+tend+"%":"\u2192 igual"}</div>
        <div class="kpi-desc">\u00faltimo vs anterior</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Valorizaci\u00f3n mensual y acumulada &middot; ${emp.sucursal}</div>
          <div class="card-sub">Todos los meses &middot; % mensual + % acumulado de meses cargados</div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:var(--g50);">
            <th style="padding:8px 14px;font-size:10px;font-weight:700;color:var(--tx2);text-align:left;border-bottom:1px solid var(--bd);min-width:100px;">MES</th>
            <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--tx2);text-align:center;border-bottom:1px solid var(--bd);width:70px;">META</th>
            <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--brand);text-align:left;border-bottom:1px solid var(--bd);min-width:200px;">% MENSUAL</th>
            <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--ok);text-align:left;border-bottom:1px solid var(--bd);min-width:200px;">% ACUMULADO</th>
            <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--tx2);text-align:center;border-bottom:1px solid var(--bd);width:120px;">ESTADO</th>
          </tr></thead>
          <tbody>
            ${meses.map((m,mi)=>{
              const fut=esFuturo(m);
              const pct=fut?null:(vd?.meses[m]??null);
              const mt=getMetaMes(emp.id,m);
              const ac=fut?null:acum(mi);
              const esMes=m===mesActual;
              const col=cV(pct,mt), colA=cV(ac,mt);
              const bW=pct==null?0:mt?Math.min(pct/mt*100,100):Math.min(pct,100);
              const bA=ac==null?0:mt?Math.min(ac/mt*100,100):Math.min(ac,100);
              const bg=esMes?"background:#EBF5FC;":mi%2?"background:var(--g25);":"";
              return "<tr style='"+bg+"'>"
                +"<td style='padding:9px 14px;font-size:12px;font-weight:700;color:"+(esMes?"var(--brand)":"var(--g700)")+"'>"+m+"</td>"
                +"<td style='padding:9px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--g600);'>"+(mt!=null?mt+"%":"&#8212;")+"</td>"
                +"<td style='padding:9px 12px;'>"+(fut?"<span style='font-size:11px;color:var(--g300);'>&middot; Mes futuro</span>":pct==null?"<span style='font-size:11px;color:var(--g400);'>Sin dato</span>":bar(pct,col))+"</td>"
                +"<td style='padding:9px 12px;'>"+(fut?"<span style='font-size:11px;color:var(--g300);'>&middot;</span>":ac==null?"<span style='font-size:11px;color:var(--g400);'>&#8212;</span>":bar(ac,colA))+"</td>"
                +"<td style='padding:9px 12px;text-align:center;'>"+(fut?"<span style='color:var(--g300);'>&middot;</span>":chip(ac,mt))+"</td>"
                +"</tr>";
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="legend">
        <div class="leg-item"><span class="val-chip val-chip-ok">\u2713 Sobre meta</span></div>
        <div class="leg-item"><span class="val-chip val-chip-warn">\u2197 Cerca</span></div>
        <div class="leg-item"><span class="val-chip val-chip-err">\u2198 Bajo meta</span></div>
        <div class="leg-item"><span class="val-chip val-chip-na">Sin dato</span></div>
        <div class="leg-item" style="margin-left:auto;font-size:10px;color:var(--g400);">% Acumulado = dato real de Recylink (fila "% Acumulado" del Sheet)</div>
      </div>
    </div>
  `;
}

function descargarHTML(htmlContent, nombre){
  try {
    // Construir HTML completo
    const doc = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
      +'<title>'+nombre+'</title>'
      +'<style>@page{size:legal portrait;margin:14mm 12mm;}body{font-family:-apple-system,Arial,sans-serif;margin:14mm 12mm;color:#101828;print-color-adjust:exact;-webkit-print-color-adjust:exact;}</style>'
      +'</head><body>'+htmlContent
      +'<script>window.addEventListener("load",function(){window.print();});<\/script>'
      +'</body></html>';

    // Método 1: data URI con download
    const encoded = 'data:text/html;charset=utf-8,' + encodeURIComponent(doc);
    const a = document.createElement('a');
    a.setAttribute('href', encoded);
    a.setAttribute('download', nombre+'.html');
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); }, 1000);

  } catch(e) {
    alert('Para exportar: usa Chrome o Edge y abre el archivo HTML descargado.');
  }
}

// Genera una vista de impresión completa con TODOS los meses
function imprimirInformeCompleto(){
  const emp   = EMPRESAS.find(e=>e.id===empActual);
  const now   = new Date();
  const fecha = now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});

  // ── Helpers de impresión ─────────────────────────────────────
  function bdgP(v,imp){
    if(v===null||v===undefined) return '<span style="color:#98A2B3;">—</span>';
    if(typeof v==='number'){ if(v===0)return'<span style="color:#F04438;font-weight:700;">✗</span>'; if(v>=imp)return'<span style="color:#039855;font-weight:700;">✓</span>'; return'<span style="color:#92400E;font-weight:700;">'+v+'/'+imp+'</span>'; }
    return v===true?'<span style="color:#039855;">✓</span>':'<span style="color:#F04438;">✗</span>';
  }
  function sec(titulo){ return '<div style="font-size:11px;font-weight:700;color:#0F4C81;text-transform:uppercase;letter-spacing:.5px;padding:10px 0 6px;border-bottom:2px solid #0F4C81;margin:18px 0 10px;">'+titulo+'</div>'; }
  function kpi(lbl,val,col){ return '<div style="border:1px solid #E4E7EC;border-radius:8px;padding:10px 12px;"><div style="font-size:8px;font-weight:700;color:#667085;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;">'+lbl+'</div><div style="font-size:20px;font-weight:700;color:'+col+'">'+val+'</div></div>'; }

  const pTrazoM = pctTrazabilidadMes(emp,mesActual)??0;

  const pValA   = pasadosV.length?Math.round(pasadosV.map(m=>vd.meses[m]).reduce((a,b)=>a+b)/pasadosV.length*10)/10:null;
  const pCse    = pctCSE(emp);

  let body = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 0 12px;border-bottom:2.5px solid #0F4C81;margin-bottom:14px;">

        <div style="font-size:13px;font-weight:700;color:#101828;">${EMPRESA_NOMBRE} · ${emp.sucursal}</div>

      ${kpi('Trazabilidad Mensual', pTrazoM+'%', colorPct(pTrazoM))}
      ${kpi('Trazabilidad Anual',   pTrazoA+'%', colorPct(pTrazoA))}
      ${kpi('Documentos Mensual',   pDocM+'%',   colorPct(pDocM))}
      ${kpi('Valorización Mensual', pValM===null?'—':pValM+'%', colorPct(pValM??0))}
      ${kpi('Valorización Anual',   pValA===null?'—':pValA+'%', colorPct(pValA??0))}
      ${kpi('Seguimiento CSE',      pCse+'%',    colorPct(pCse))}

  // ── 1. TRAZABILIDAD MENSUAL ──────────────────────────────────

      +'<th style="padding:5px;text-align:center;border-bottom:1px solid #E4E7EC;background:#F9FAFB;">%</th>'
      +'</tr></thead><tbody>'
      +resMes.map((r,i)=>{
        const imp=esNuevoFormato(r)?r.imp:1;
        let ok=0,tot=0; ok+=imp;tot+=imp;
        TRAZO.forEach(d=>{const f=docFrac(r.docs[d],imp);if(f){tot+=f[1];ok+=f[0];}});
        const pR=tot===0?null:Math.round(ok/tot*100);
        return '<tr class="'+(i%2?'even':'')+'">'

      +resMes.map((r,i)=>{

function renderClBody(){

    const tieneOp = res.length > 0;
    if(tieneOp) okCount++; else errCount++;

    // Valorización acumulada: SOLO dato real del Sheet
    const vd      = VAL_DATA[emp.id];

    const pValAc  = ultimoAcumCl!==undefined ? vd.acumulado[ultimoAcumCl] : null;
    const metaV   = getMetaMes(emp.id, mesActual);
    const colV    = pValAc===null?'var(--g300)':metaV?pValAc>=metaV?'var(--ok)':pValAc>=metaV*.7?'var(--warn)':'var(--err)':colorPct(pValAc);

    const detalle = emp.mensual[mesActual]?.obs || '';
    const bg = i%2===0?'':'background:var(--g25)';
    const trClass = emp.id===empActual?'style="background:var(--clr-l);"':'style="'+bg+'"';

function exportarCheckListExcel(){
  const mi = MESES.indexOf(mesActual);
  const rows = [
    ['Sucursal', 'Trazabilidad', '% Trazabilidad', '% Valorización Acumulada', 'Observación']
  ];

  EMPRESAS.forEach(emp=>{
    const res     = resImportados(emp, mesActual);
    const tieneOp = res.length > 0;
    const trazo   = pctTrazabilidadMes(emp, mesActual);
    const vd      = VAL_DATA[emp.id];
    const pasados = MESES.slice(0,mi+1).filter(m=>!esFuturo(m)&&vd?.meses[m]!=null);
    const pValAc  = pasados.length?Math.round(pasados.map(m=>vd.meses[m]).reduce((a,b)=>a+b)/pasados.length*10)/10:null;
    const detalle = emp.mensual[mesActual]?.obs || '';

    rows.push([
      emp.sucursal,
      tieneOp ? '✓ Operó' : '✗ Sin operaciones',
      trazo !== null ? trazo + '%' : '—',
      pValAc !== null ? pValAc + '%' : '—',
      detalle || ''
    ]);
  });

  // Generar CSV con BOM para que Excel lo abra bien
  const bom  = '﻿';
  const csv  = bom + rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'CheckList_' + EMPRESA_NOMBRE + '_' + mesActual + '_2026.csv';
  a.click();
  URL.revokeObjectURL(url);
}

let datosCargados = false;

function actualizarSelectorMeses_(){
  const sel = document.getElementById("selMes");
  if(!sel) return;
  sel.innerHTML = MESES_ACTIVOS.map(m =>
    `<option value="${m}" ${m===mesActual?'selected':''}>${m} 2026</option>`

function cargarDatos(esRefrescoSilencioso){
  if(!esRefrescoSilencioso) mostrarEstadoCarga_("Cargando datos desde Google Sheets…");

  const callbackName = "__onDatosRecylink_" + Date.now();
  window[callbackName] = function(payload){
    delete window[callbackName];
    scriptTag.remove();

    if(!payload || payload.error){
      mostrarEstadoCarga_("Error al cargar datos: " + (payload && payload.message ? payload.message : "desconocido") + ". Reintentando en " + REFRESH_MINUTOS + " min.");
      return;
    }

    EMPRESAS.length = 0;
    payload.EMPRESAS.forEach(e => EMPRESAS.push(e));

    Object.keys(VAL_DATA).forEach(k => delete VAL_DATA[k]);
    Object.assign(VAL_DATA, payload.VAL_DATA);

    MESES_ACTIVOS = payload.MESES_ACTIVOS && payload.MESES_ACTIVOS.length
      ? payload.MESES_ACTIVOS
      : MESES_ACTIVOS;

    if(!empActual && EMPRESAS.length) empActual = EMPRESAS[0].id;
    if(!mesActual || !MESES_ACTIVOS.includes(mesActual)) {
      mesActual = MESES_ACTIVOS[MESES_ACTIVOS.length - 1] || "Enero";
    }

    actualizarSelectorMeses_();

    datosCargados = true;
    ocultarEstadoCarga_();

    renderSidebar();
    renderMain();
    buildEmpresaSelect();
    buildSucursalSelect();
  };

  const scriptTag = document.createElement("script");
  scriptTag.src = DATA_SOURCE_URL + "?visor=1&callback=" + callbackName + "&_=" + Date.now();
  scriptTag.onerror = function(){
    delete window[callbackName];
    mostrarEstadoCarga_("No se pudo contactar la fuente de datos. Reintentando en " + REFRESH_MINUTOS + " min.");
  };
  document.body.appendChild(scriptTag);
}

function mostrarEstadoCarga_(msg){
  let el = document.getElementById("estado-carga");
  if(!el){
    el = document.createElement("div");
    el.id = "estado-carga";
    el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#0069A6;color:#fff;font-size:12px;font-weight:600;padding:6px 16px;text-align:center;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
}
function ocultarEstadoCarga_(){
  const el = document.getElementById("estado-carga");
  if(el) el.style.display = "none";
}

// ---------- CSV parser mínimo ----------
function mnParseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field=""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if (c === '\r'){}
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function mnIsBlankCell(v){ return v === null || v === undefined || v === ""; }
function mnNormalize(v){
  if (v === true) return "true";
  if (v === false) return "false";
  return (v || "").toString().trim().toLowerCase();
}
function mnIsTrueVal(v){ return mnNormalize(v) === "true" || mnNormalize(v) === "verdadero"; }

// Una fila es "de título" si la columna A tiene algo y el resto (hasta la F)
// está vacío. Sirve tanto para títulos de texto ("Minuta 4/11/2025", COPEC)
// como para una fecha pura en la celda (PMS), sin depender del texto.
function mnIsSessionHeader(row){
  if (mnIsBlankCell(row[0])) return false;
  for (let i = 1; i < Math.min(row.length, 6); i++){
    if (!mnIsBlankCell(row[i])) return false;
  }
  return true;
}
function mnIsSubHeaderRow(row){
  const a = mnNormalize(row[0]);
  return a === "items" || a === "item" || a === "tema";
}
function mnIsFullyBlank(row){
  for (let i = 0; i < Math.min(row.length, 6); i++){
    if (!mnIsBlankCell(row[i])) return false;
  }
  return true;
}
// Lee la fila de sub-encabezado (si existe) y detecta en qué columna está
// cada campo — así el mismo parser sirve para "Items,Cumplimiento,Comentarios"
// (COPEC, con Acuerdos/Revisado sin etiqueta en D/E) como para
// "Tema,Revisado,Detalle,Acuerdos,Resuelto" (PMS, con otro orden).
function mnBuildColMap(subRow){
  const map = { item:0, cumplido:1, comentario:2, acuerdos:3, revisado:4 }; // fallback posicional
  if (!subRow) return map;
  let cumplidoSet = false, revisadoSet = false, resueltoIdx = -1;
  subRow.forEach((cell, idx) => {
    const v = mnNormalize(cell);
    if (v === "item" || v === "items" || v === "tema") map.item = idx;
    else if (v === "cumplimiento" || v === "cumplido"){ map.cumplido = idx; cumplidoSet = true; }
    else if (v === "comentario" || v === "comentarios" || v === "detalle") map.comentario = idx;
    else if (v === "acuerdo" || v === "acuerdos") map.acuerdos = idx;
    else if (v === "revisado"){ map.revisado = idx; revisadoSet = true; }
    else if (v === "resuelto") resueltoIdx = idx;
  });
  if (resueltoIdx !== -1){
    if (!cumplidoSet) map.cumplido = resueltoIdx;
    else if (!revisadoSet) map.revisado = resueltoIdx;
  }
  return map;
}
// Fechas puras (celda de PMS) llegan como ISO ("2026-07-01T00:00:00.000Z")
// tras pasar por JSON — se formatean lindo. Títulos de texto (COPEC) quedan igual.
function mnFormatTitle(raw){
  if (mnIsBlankCell(raw)) return "";
  const s = raw.toString();
  const iso = /^(\d{4})-(\d{2})-(\d{2})T/.exec(s);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  return s.trim();
}
function mnRowsToSessions(rows){
  const out = [];
  let i = 0;
  while (i < rows.length){
    const row = rows[i] || [];
    if (mnIsSessionHeader(row)){
      const headerRow = i + 1; // fila real (1-indexed) en el Sheet
      const title = mnFormatTitle(row[0]);
      let r = i + 1;
      let colMap = { item:0, cumplido:1, comentario:2, acuerdos:3, revisado:4 };
      if (r < rows.length && mnIsSubHeaderRow(rows[r] || [])){
        colMap = mnBuildColMap(rows[r]);
        r++;
      }
      const dataStartRow = r + 1; // fila real (1-indexed) del primer ítem
      const items = [];
      while (r < rows.length){
        const cur = rows[r] || [];
        if (mnIsSessionHeader(cur)) break;
        if (mnIsFullyBlank(cur)){
          const next = rows[r+1] || [];
          if (!next.length || mnIsFullyBlank(next) || mnIsSessionHeader(next)) break;
          r++;
          continue;
        }
        items.push({
          item: (cur[colMap.item] || "").toString().trim(),
          cumplido: mnIsTrueVal(cur[colMap.cumplido]),
          comentario: (cur[colMap.comentario] || "").toString().trim(),
          acuerdos: (cur[colMap.acuerdos] || "").toString().trim(),
          revisado: mnIsTrueVal(cur[colMap.revisado])
        });
        r++;
      }
      out.push({ title: title || `Sesión fila ${headerRow}`, headerRow, dataStartRow, colMap, items });
      i = r;
    } else {
      i++;
    }
  }
  return out;
}

function mnLoadConfig(){ try{ const raw = localStorage.getItem(MN_LS_SCRIPT); if (raw) mnScriptUrl = raw; }catch(e){} }
function mnSaveConfig(){ try{ localStorage.setItem(MN_LS_SCRIPT, mnScriptUrl || ""); }catch(e){} }
function mnLoadCachedData(){ try{ const raw = localStorage.getItem(MN_LS_DATA); if (raw) mnSessions = JSON.parse(raw); }catch(e){} }
function mnCacheData(){ try{ localStorage.setItem(MN_LS_DATA, JSON.stringify(mnSessions)); }catch(e){} }
function mnMarkDirty(){ mnDirty = true; mnCacheData(); mnScheduleAutoSave(); }

let mnAutoSaveTimer = null;
const MN_AUTOSAVE_DELAY_MS = 1500;
function mnScheduleAutoSave(){
  clearTimeout(mnAutoSaveTimer);
  if (!mnScriptUrl){ mnSetStatus("idle", "Cambios sin guardar (sin Apps Script configurado)"); mnUpdateStatusUI(); return; }
  mnSetStatus("idle", "Cambios sin guardar — se guardará solo…");
  mnUpdateStatusUI();
  mnAutoSaveTimer = setTimeout(() => mnSave(true), MN_AUTOSAVE_DELAY_MS);
}

function mnFetchSheet(silencioso){
  mnSetStatus("idle", "Cargando…");
  if(!silencioso) mnShowToast("Actualizando minutas…");

  const callbackName = "__onMinutasRecylink_" + Date.now();
  window[callbackName] = function(payload){
    delete window[callbackName];
    scriptTag.remove();

    if(!payload || payload.error){
      mnSetStatus("err", "No se pudo leer la hoja de Minutas");
      if(!silencioso) mnShowToast("No se pudo leer la pestaña 'Minuta'" + (payload && payload.message ? ": " + payload.message : "") + ".", true);
      return;
    }

    const prevHeaderRow = mnSessions[mnActiveIdx] ? mnSessions[mnActiveIdx].headerRow : null;
    mnSessions = mnRowsToSessions(payload.rows || []);
    const matchIdx = prevHeaderRow ? mnSessions.findIndex(s => s.headerRow === prevHeaderRow) : -1;
    mnActiveIdx = matchIdx !== -1 ? matchIdx : (mnSessions.length ? mnSessions.length - 1 : 0);
    mnCacheData();
    mnDirty = false;
    mnSetStatus("ok", "Sincronizado " + new Date().toLocaleTimeString());
    if(!silencioso) mnShowToast(mnSessions.length ? `Se cargaron ${mnSessions.length} minutas.` : "No se reconoció ninguna minuta en la pestaña.");
    if(vistaGlobal === "minutas"){ renderSidebar(); renderMain(); } else { renderSidebar(); }
  };

  const scriptTag = document.createElement("script");
  scriptTag.src = DATA_SOURCE_URL + "?minutas=1&callback=" + callbackName + "&_=" + Date.now();
  scriptTag.onerror = function(){
    delete window[callbackName];
    mnSetStatus("err", "No se pudo contactar el Apps Script");
    if(!silencioso) mnShowToast("No se pudo contactar el Apps Script para leer las minutas.", true);
  };
  document.body.appendChild(scriptTag);
}

function mnSaveViaHiddenForm(url, jsonString){
  return new Promise((resolve, reject) => {
    try {
      const host = mnEl("mnSaveFrameHost");
      const frameName = "mnSaveFrame_" + Date.now();
      const iframe = document.createElement("iframe");
      iframe.name = frameName;
      host.appendChild(iframe);

      const form = document.createElement("form");
      form.method = "POST";
      form.action = url;
      form.target = frameName;

      const input = document.createElement("input");
      input.type = "hidden";
      input.name = "payload";
      input.value = jsonString;
      form.appendChild(input);
      host.appendChild(form);

      let settled = false;
      iframe.addEventListener("load", () => {
        if (settled) return;
        settled = true;
        setTimeout(() => { iframe.remove(); form.remove(); }, 300);
        resolve();
      });
      form.submit();
      setTimeout(() => { if (!settled){ settled = true; resolve(); } }, 5000);
    } catch (e){ reject(e); }
  });
}

async function mnSave(silencioso){
  clearTimeout(mnAutoSaveTimer);
  if (!mnScriptUrl){
    if(!silencioso){ mnCfgOpen = true; renderMain(); mnShowToast("Pega la URL del Apps Script para poder guardar en el Sheet.", true); }
    return;
  }
  const btn = mnEl("mnSaveBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Guardando…"; }
  mnSetStatus("idle", "Guardando…"); mnUpdateStatusUI();
  const payload = { tipo: "minutas", sheetId: MN_SHEET_ID, sheetName: MN_SHEET_NAME, sessions: mnSessions };
  let savedOk = false, errorMsg = "";
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(mnScriptUrl, {
      method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    let json;
    try { json = await res.json(); } catch(e){ throw new Error("Respuesta no-JSON del Apps Script"); }
    if (json.ok === false) throw new Error(json.error || "Error desconocido");
    savedOk = true;
  } catch(err){
    console.warn("Fetch directo falló, probando formulario oculto:", err);
    try { await mnSaveViaHiddenForm(mnScriptUrl, JSON.stringify(payload)); savedOk = true; }
    catch(err2){ console.error(err2); errorMsg = "No se pudo enviar los cambios."; }
  }
  if (savedOk){
    mnDirty = false;
    if(!silencioso) mnShowToast("Cambios guardados en el Sheet.");
    mnSetStatus("ok", "Guardado automático " + new Date().toLocaleTimeString());
  } else {
    // Reintenta el autoguardado más adelante; no se pierde el cambio, sigue en localStorage.
    mnShowToast(errorMsg || "No se pudo guardar.", true);
    mnSetStatus("err", "Error al guardar — reintentando…");
    if (silencioso) mnAutoSaveTimer = setTimeout(() => mnSave(true), MN_AUTOSAVE_DELAY_MS * 4);
  }
  mnUpdateStatusUI();
}

function mnUpdateStatusUI(){
  const dot = mnEl("mnStatusDot");
  const txt = mnEl("mnStatusText");
  if(dot) dot.className = "mn-status-dot" + (mnStatus.state==='ok'?' ok':mnStatus.state==='err'?' err':'');
  if(txt) txt.textContent = mnStatus.text;
  const btn = mnEl("mnSaveBtn");
  if(btn){ btn.disabled = !mnSessions.length; btn.textContent = "Guardar ahora"; }
}

function mnExportCSV(){
  let out = "Minuta,Item,Cumplimiento,Comentario,Acuerdos,Revisado\n";
  const esc = (s) => `"${(s||"").toString().replace(/"/g,'""')}"`;
  mnSessions.forEach(sess => sess.items.forEach(it => {
    out += [esc(sess.title), esc(it.item), it.cumplido?"TRUE":"FALSE", esc(it.comentario), esc(it.acuerdos), it.revisado?"TRUE":"FALSE"].join(",") + "\n";
  }));
  const blob = new Blob([out], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "minutas-copec.csv"; a.click();
  mnShowToast("Exportado como .csv");
}

function mnExportWord(){
  if (!mnSessions.length || !mnSessions[mnActiveIdx]){ mnShowToast("No hay minuta seleccionada.", true); return; }
  const sess = mnSessions[mnActiveIdx];
  const escW = mnEscapeHtml;
  const rowsHtml = sess.items.map(it => `
    <tr>
      <td style="border:1px solid #999;padding:6px;text-align:center;">${it.revisado ? "✔" : ""}</td>
      <td style="border:1px solid #999;padding:6px;text-align:center;">${it.cumplido ? "✔" : ""}</td>
      <td style="border:1px solid #999;padding:6px;">${escW(it.item)}</td>
      <td style="border:1px solid #999;padding:6px;">${escW(it.comentario)}</td>
      <td style="border:1px solid #999;padding:6px;">${escW(it.acuerdos)}</td>
    </tr>
  `).join("");
  const total = sess.items.length;
  const done = sess.items.filter(i=>i.cumplido).length;
  const reviewed = sess.items.filter(i=>i.revisado).length;
  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${escW(sess.title)}</title>
    <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--></head>
    <body style="font-family:Calibri, Arial, sans-serif; font-size:12pt;">
      <h1 style="font-size:18pt;margin-bottom:2px;">Recylink — ${EMPRESA_NOMBRE} · Minutas</h1>
      <h2 style="font-size:14pt;color:#0069A6;margin-top:0;">${escW(sess.title.trim() || "Sin título")}</h2>
      <p style="font-size:10pt;color:#555;">${total} ítem${total===1?"":"s"} · ${reviewed} revisado${reviewed===1?"":"s"} · ${done} cumplido${done===1?"":"s"}</p>
      <table style="border-collapse:collapse;width:100%;font-size:10.5pt;">
        <thead><tr style="background:#F2F4F7;">
          <th style="border:1px solid #999;padding:6px;">Revisado</th>
          <th style="border:1px solid #999;padding:6px;">Cumplido</th>
          <th style="border:1px solid #999;padding:6px;text-align:left;">Ítem</th>
          <th style="border:1px solid #999;padding:6px;text-align:left;">Comentario</th>
          <th style="border:1px solid #999;padding:6px;text-align:left;">Acuerdos</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </body></html>
  `;
  const blob = new Blob(['\ufeff', html], { type: "application/msword" });
  const safeName = (sess.title.trim() || "minuta").replace(/[\\/:*?"<>|]/g, "").trim() || "minuta";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = safeName + ".doc";
  a.click();
  mnShowToast("Exportado como Word (.doc)");
}

}
function volverASucursales(){
  vistaGlobal = "empresa";
  renderSidebar(); renderMain(); mnUpdateAccessBtn();
}

  else irAMinutas();
}

function mnRenderKPIs(){

  const done = items.filter(i=>i.cumplido).length;

  kpiRow.innerHTML = `

function mnRenderCard(){

  const sess = mnSessions[mnActiveIdx];
  const items = sess.items;
  const total = items.length;
  const done = items.filter(i=>i.cumplido).length;
  const pct = total ? Math.round(done/total*100) : 0;

  let visibleIdxs = items.map((_, i) => i).filter(i => {
    if (mnFilter === "pendientes") return !items[i].cumplido;
    if (mnFilter === "revisados") return items[i].cumplido;

  });

  let html = `

    </div>

  if (!total){
    html += `<div class="mn-empty-state">Sin ítems en esta minuta todavía.</div>`;
  } else if (!visibleIdxs.length){
    html += `<div class="mn-empty-state">No hay ítems en este filtro.</div>`;
  } else {
    html += `<table><thead><tr>
      <th class="mn-mc">Revisado</th>
      <th class="mn-mc">Cumplido</th>
      <th>Ítem</th>
      <th>Comentario</th>
      <th>Acuerdos</th>
      <th class="mn-mc">Estado</th>
      <th class="mn-rc"></th>
    </tr></thead><tbody>`;
    visibleIdxs.forEach(i => {
      const it = items[i];
      html += `
        <tr class="${it.cumplido?'mn-done':''}">
          <td class="mn-mc"><input type="checkbox" onchange="mnOnRevisado(${i}, this.checked)" ${it.revisado?"checked":""}></td>
          <td class="mn-mc"><input type="checkbox" onchange="mnOnCheck(${i}, this.checked)" ${it.cumplido?"checked":""}></td>
          <td><textarea class="mn-item-input" oninput="mnOnItem(${i}, this.value)" placeholder="Ítem de la minuta…">${mnEscapeHtml(it.item)}</textarea></td>
          <td><textarea class="mn-cell-textarea" oninput="mnOnComentario(${i}, this.value)" placeholder="Comentario…">${mnEscapeHtml(it.comentario)}</textarea></td>
          <td><textarea class="mn-cell-textarea" oninput="mnOnAcuerdos(${i}, this.value)" placeholder="Acuerdos…">${mnEscapeHtml(it.acuerdos)}</textarea></td>
          <td class="mn-mc"><button class="badge ${it.cumplido?'b-ok':'b-falta'}" onclick="mnOnBadgeToggle(${i})" type="button">${it.cumplido?'✓ Cumplido':'Pendiente'}</button></td>
          <td class="mn-mc"><button class="mn-remove-btn" onclick="mnOnRemove(${i})" title="Eliminar" type="button">✕</button></td>
        </tr>
      `;
    });
    html += `</tbody></table>`;
  }
  card.innerHTML = html;
}

function mnOnCheck(i, val){ mnSessions[mnActiveIdx].items[i].cumplido = val; mnMarkDirty(); mnRenderKPIs(); mnRenderCard(); renderSidebar(); }
function mnOnRevisado(i, val){ mnSessions[mnActiveIdx].items[i].revisado = val; mnMarkDirty(); }
function mnOnBadgeToggle(i){ mnSessions[mnActiveIdx].items[i].cumplido = !mnSessions[mnActiveIdx].items[i].cumplido; mnMarkDirty(); mnRenderKPIs(); mnRenderCard(); renderSidebar(); }
function mnOnItem(i, val){ mnSessions[mnActiveIdx].items[i].item = val; mnMarkDirty(); }
function mnOnComentario(i, val){ mnSessions[mnActiveIdx].items[i].comentario = val; mnMarkDirty(); }
function mnOnAcuerdos(i, val){ mnSessions[mnActiveIdx].items[i].acuerdos = val; mnMarkDirty(); }
function mnOnRemove(i){
  if (!confirm("¿Eliminar este ítem?")) return;
  mnSessions[mnActiveIdx].items.splice(i,1);
  mnMarkDirty(); mnRenderKPIs(); mnRenderCard(); renderSidebar();
}
function mnOnAddRow(){
  mnSessions[mnActiveIdx].items.push({ item:"", cumplido:false, comentario:"", acuerdos:"", revisado:false });
  mnMarkDirty(); mnRenderCard(); renderSidebar();
}
